<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글쓰기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-row">
      <div class="brand">my <span>blog</span></div>
    </div>
    <div id="menu-container" class="menu"></div>
  </header>

  <main class="page-shell">
    <h1 class="page-title">새 글 작성</h1>

    <section class="form-panel">
      <form id="postForm" class="form-stack">
        <input id="postId" type="hidden" />

        <div class="form-row">
          <label class="form-label" for="postTitle">제목</label>
          <input id="postTitle" class="text-input" type="text" placeholder="제목을 입력하세요" />
        </div>

        <div class="form-row">
          <label class="form-label" for="postCategory">카테고리</label>
          <input id="postCategory" class="text-input" type="text" placeholder="예: 여행, 일상, 기록" />
        </div>

        <div class="form-row">
          <label class="form-label" for="postContent">내용</label>
          <textarea id="postContent" class="textarea-input" placeholder="오늘의 이야기를 작성해 주세요."></textarea>
        </div>

        <div class="form-row">
          <label class="form-label" for="postImage">대표 이미지</label>
          <input id="postImage" class="file-input" type="file" accept="image/*" />
        </div>

        <div class="form-actions">
          <button class="primary-btn" type="submit">저장하기</button>
          <button class="secondary-btn" type="button" onclick="location.href='view.html'">글 목록</button>
          <span id="saveStatus" class="status-text" aria-live="polite"></span>
        </div>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
