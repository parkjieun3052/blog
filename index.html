<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Blog</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== 헤더 / 브랜드 / 네비게이션 ===== -->
  <header class="site-header">
    <div class="brand-row">
      <div class="brand" aria-label="블로그 이름">
        <span class="brand-main">ORDINARY</span>
        <span class="brand-sub">archive</span>
      </div>
    </div>
    <div id="menu-container" class="menu"></div>
  </header>

  <!-- ===== 메인 페이지 콘텐츠 ===== -->
  <main class="page-shell home-shell">
    <!-- 메인 히어로 영역: 배경 이미지와 소개 문구 -->
    <section id="home" class="hero" aria-label="블로그 메인 배경">
      <div class="hero-content">
        <h1>jieun - blog</h1>
        <p> 박지은의 블로그입니다.</p>
      </div>
    </section>

    <!-- 추천 글 카드 영역 -->
    <section id="featured" class="content-section" aria-label="인기 글">
      <div class="section-head">
        <h2>추천 글</h2>
      </div>
      <div id="popularPosts" class="featured-grid"></div>
    </section>

    <!-- 최신 글 목록 영역 -->
    <section id="my-posts" class="content-section" aria-label="나의 글">
      <div class="section-head">
        <h2>나의 글</h2>
      </div>
      <div id="latestPosts" class="featured-grid"></div>
    </section>

    <!-- 댓글 영역: 작성 폼 + 댓글 리스트 -->
    <section id="comments" class="content-section comment-section" aria-label="Blog comments">
      <div class="section-head">
        <h2>Comments</h2>
      </div>

      <div class="comment-panel">
        <div id="commentList" class="comment-list" aria-live="polite"></div>

        <form id="commentForm" class="comment-form">
          <div class="comment-inputs">
            <label class="field-group">
              <span>닉네임</span>
              <input id="commentAuthor" type="text" maxlength="20" placeholder="닉네임을 입력해 주세요" aria-label="닉네임" />
            </label>
            <label class="field-group">
              <span>비밀번호</span>
              <input id="commentPassword" type="password" maxlength="20" placeholder="수정/삭제용 비밀번호" aria-label="비밀번호" />
            </label>
          </div>
          <label class="field-group comment-field">
            <span>댓글</span>
            <textarea id="commentMessage" rows="4" maxlength="300" placeholder="이 블로그에 남기고 싶은 말을 적어주세요." aria-label="댓글 내용"></textarea>
          </label>
          <div class="comment-submit-wrap">
            <button type="submit" class="comment-submit">댓글 남기기</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
